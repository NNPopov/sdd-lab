# ============================================================
# Redis — Deployment + Service
# Redis is used for: cache, queue (arq), rate limiting
# We use Deployment (not StatefulSet) — Redis tolerates
# restarts without loss of critical data in our case
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fastapi-demo
  labels:
    app: redis
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command: ["redis-server", "--appendonly", "yes"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}  # OK for learning; use PVC in production

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: fastapi-demo
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
