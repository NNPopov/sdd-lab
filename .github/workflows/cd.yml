name: CD - Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        default: "deploy-only"
        type: choice
        options:
          - build-only
          - build-push
          - build-push-deploy
          - deploy-only
      service:
        description: "Which service"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - api
          - flutter
      image_tag:
        description: "Image tag to deploy (used for deploy-only)"
        required: false
        default: "latest"
        type: string
      run_migrations:
        description: "Run Alembic migrations before deploy?"
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 017091936354.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: fastapi-demo-cluster
  K8S_NAMESPACE: fastapi-demo

jobs:
  cd:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================================
      # BUILD (runs for: build-only, build-push, build-push-deploy)
      # ============================================================
      - name: Set up Docker Buildx
        if: inputs.action != 'deploy-only'
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        if: inputs.action != 'deploy-only'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build API image
        if: inputs.action != 'deploy-only' && (inputs.service == 'api' || inputs.service == 'both')
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./docker/Dockerfile.api
          # Push only for build-push and build-push-deploy
          push: ${{ inputs.action == 'build-push' || inputs.action == 'build-push-deploy' }}
          tags: |
            ${{ env.ECR_REGISTRY }}/fastapi-demo/backend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/fastapi-demo/backend:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Flutter image
        if: inputs.action != 'deploy-only' && (inputs.service == 'flutter' || inputs.service == 'both')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.flutter
          push: ${{ inputs.action == 'build-push' || inputs.action == 'build-push-deploy' }}
          tags: |
            ${{ env.ECR_REGISTRY }}/fastapi-demo/frontend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/fastapi-demo/frontend:latest
          cache-from: type=gha,scope=flutter
          cache-to: type=gha,mode=max,scope=flutter

      # ============================================================
      # DEPLOY (runs for: build-push-deploy, deploy-only)
      # ============================================================
      - name: Update kubeconfig
        if: inputs.action == 'build-push-deploy' || inputs.action == 'deploy-only'
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Run Alembic migrations
        if: |
          inputs.run_migrations == true &&
          (inputs.action == 'build-push-deploy' || inputs.action == 'deploy-only') &&
          (inputs.service == 'api' || inputs.service == 'both')
        run: |
          kubectl delete job alembic-migrate -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
          kubectl create job alembic-migrate \
            --image=${{ env.ECR_REGISTRY }}/fastapi-demo/backend:${{ inputs.image_tag }} \
            -n ${{ env.K8S_NAMESPACE }} \
            -- alembic upgrade head
          kubectl patch job alembic-migrate -n ${{ env.K8S_NAMESPACE }} \
            --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/envFrom","value":[{"secretRef":{"name":"fastapi-demo-secret"}}]}]'
          kubectl wait job/alembic-migrate \
            -n ${{ env.K8S_NAMESPACE }} \
            --for=condition=complete \
            --timeout=300s
          kubectl logs job/alembic-migrate -n ${{ env.K8S_NAMESPACE }}

      - name: Deploy API
        if: |
          (inputs.action == 'build-push-deploy' || inputs.action == 'deploy-only') &&
          (inputs.service == 'api' || inputs.service == 'both')
        run: |
          TAG=${{ inputs.action == 'build-push-deploy' && github.sha || inputs.image_tag }}
          kubectl set image deployment/fastapi-backend \
            fastapi=${{ env.ECR_REGISTRY }}/fastapi-demo/backend:$TAG \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/fastapi-backend \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Deploy Flutter
        if: |
          (inputs.action == 'build-push-deploy' || inputs.action == 'deploy-only') &&
          (inputs.service == 'flutter' || inputs.service == 'both')
        run: |
          TAG=${{ inputs.action == 'build-push-deploy' && github.sha || inputs.image_tag }}
          kubectl set image deployment/flutter-frontend \
            flutter-nginx=${{ env.ECR_REGISTRY }}/fastapi-demo/frontend:$TAG \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/flutter-frontend \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      # ============================================================
      # SUMMARY
      # ============================================================
      - name: Summary
        if: always()
        run: |
          echo "## CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ inputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ inputs.service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ inputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY