name: CI - Build and Push to ECR

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - api
          - flutter

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 017091936354.dkr.ecr.us-east-1.amazonaws.com

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'docker/Dockerfile.api'
            flutter:
              - 'flutter/**'
              - 'docker/Dockerfile.flutter'

  build-api:
    name: Build and Push API
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event.inputs.service == 'api' || github.event.inputs.service == 'both'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/fastapi-demo/backend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/fastapi-demo/backend:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-flutter:
    name: Build and Push Flutter
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || github.event.inputs.service == 'flutter' || github.event.inputs.service == 'both'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.flutter
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/fastapi-demo/frontend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/fastapi-demo/frontend:latest
          cache-from: type=gha,scope=flutter
          cache-to: type=gha,mode=max,scope=flutter

  ci-success:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [build-api, build-flutter]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build-api.result }}" == "failure" || "${{ needs.build-flutter.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"